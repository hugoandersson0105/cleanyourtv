plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.alessandromata.watchsuggestions'
    compileSdk 34

    defaultConfig {
        applicationId 'io.github.alessandromata.watchsuggestions'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "0.1"
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Sideload por ADB, nunca publicado: assinado com a chave debug.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
